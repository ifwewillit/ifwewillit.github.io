<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>にな × Japan · pick your vibe</title>
<meta name="description" content="Five ways Nina's Japan blog & guide could look. Play with each logo, copy the palettes, heart your favorites.">
<meta property="og:title" content="にな × Japan: pick your vibe 💖">
<meta property="og:description" content="Five ways your site could look. Play with the logos, heart your favorites, send Will your picks.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Courier+Prime:wght@400;700&family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@900&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
<style>
  :root{
    --bg:#FBFAF7; --ink:#1B1A17; --muted:#6E6C64; --line:#E7E4DB; --panel:#FFFFFF; --chip:#F1EFE8;
    --pink:#FF4D94;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--ink); margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    line-height:1.55; overflow-x:hidden;
  }
  button{font:inherit;cursor:pointer}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
  .wrap{max-width:1020px;margin:0 auto;padding:0 20px}

  /* petals */
  #petals{position:fixed;inset:0;pointer-events:none;z-index:0}
  #root{position:relative;z-index:1}

  /* ------- chrome ------- */
  header.masthead{padding:56px 0 22px}
  .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  h1.title{font-size:clamp(30px,5.4vw,48px);line-height:1.1;margin:0 0 14px;font-weight:750;text-wrap:balance}
  h1.title .hl{color:var(--pink)}
  .lede{max-width:64ch;color:var(--muted);font-size:16px;margin:0}
  .lede strong{color:var(--ink)}

  /* story tabs */
  .storybar{position:sticky;top:0;z-index:50;background:rgba(251,250,247,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 0 10px;margin-top:26px}
  .storybar .wrap{display:flex;flex-direction:column;gap:8px}
  .segs{display:flex;gap:6px}
  .seg{flex:1;height:4px;border-radius:99px;background:var(--line);overflow:hidden;border:none;padding:0;position:relative}
  .seg i{display:block;height:100%;width:0;background:var(--pink);border-radius:99px;transition:width .35s ease}
  .seg.done i{width:100%;background:#E9B7CC}
  .seg.active i{width:100%}
  .tabnames{display:flex;gap:6px}
  .tabnames button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 4px;font-size:12.5px;font-weight:600;color:var(--muted);transition:all .18s ease;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabnames button .n{font-variant-numeric:tabular-nums;opacity:.55;margin-right:5px}
  .tabnames button.on{color:var(--ink);border-color:var(--ink);transform:translateY(-1px);box-shadow:0 2px 0 var(--ink)}
  @media(max-width:640px){.tabnames button{font-size:11px;padding:6px 2px}.tabnames button .n{display:none}}

  /* direction view */
  .dview{animation:viewIn .45s cubic-bezier(.2,.8,.25,1) both;padding:32px 0 10px}
  @keyframes viewIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
  .dview.back{animation-name:viewInBack}
  @keyframes viewInBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.dview{animation:none}}

  .dhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .dnum{font-size:13px;color:var(--muted);letter-spacing:.16em;font-variant-numeric:tabular-nums}
  .dname{font-size:clamp(26px,3.6vw,36px);font-weight:750;margin:0}
  .dwhy{max-width:70ch;color:var(--muted);font-size:15px;margin:8px 0 4px}
  .dwhy strong{color:var(--ink)}
  .dpick{font-size:13.5px;color:var(--muted);margin:0 0 20px}
  .dpick em{font-style:normal;font-weight:650;color:var(--ink)}

  .stage{border-radius:18px;min-height:340px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(20,18,10,.05),0 12px 34px -18px rgba(20,18,10,.25)}
  .stage-hint{position:absolute;top:14px;left:16px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;z-index:5}
  .stage-btns{position:absolute;bottom:14px;right:14px;display:flex;gap:8px;z-index:6}
  .stage-btns button{border:none;border-radius:999px;padding:8px 15px;font-size:12.5px;font-weight:650;box-shadow:0 2px 8px rgba(0,0,0,.18)}

  .row2{display:grid;grid-template-columns:5fr 7fr;gap:16px;margin-top:16px}
  @media(max-width:760px){.row2{grid-template-columns:1fr}}

  /* palette */
  .pal{display:flex;border-radius:14px;overflow:hidden;border:1px solid var(--line);min-height:130px}
  .pal button{flex:1;border:none;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 9px 9px;transition:flex .25s ease;position:relative}
  .pal button:hover{flex:1.6}
  .pal button span{font-size:10px;line-height:1.4;font-family:ui-monospace,Menlo,monospace;text-align:left;display:block}
  .pal button b{font-size:10px;display:block;text-align:left;font-family:ui-monospace,Menlo,monospace}
  .pal-label,.mock-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}

  /* typeplate */
  .typeplate{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 24px}
  .typeplate .role{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
  .typeplate .spec{margin:0 0 16px}
  .typeplate .body{font-size:14.5px;max-width:58ch}

  /* mock preview */
  .mockwrap{margin-top:16px}
  .mock-label{display:flex;align-items:center;gap:8px}
  .mock-label .dot{width:7px;height:7px;border-radius:50%;background:#34C759}
  .mock{border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 14px 40px -22px rgba(20,18,10,.3)}

  /* love + faves */
  .loverow{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
  .lovebtn{border:2px solid var(--ink);background:var(--panel);border-radius:999px;padding:11px 22px;font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:9px;transition:transform .15s ease;position:relative}
  .lovebtn:hover{transform:translateY(-2px)}
  .lovebtn.loved{background:var(--pink);border-color:var(--pink);color:#fff}
  .lovebtn .hh{font-size:17px;line-height:1}
  .navarrows{margin-left:auto;display:flex;gap:8px}
  .navarrows button{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:42px;height:42px;font-size:16px;transition:all .15s}
  .navarrows button:hover:not(:disabled){border-color:var(--ink);transform:translateY(-1px)}
  .navarrows button:disabled{opacity:.35;cursor:default}

  .burst{position:absolute;left:50%;top:50%;pointer-events:none;font-size:16px;animation:burst .85s ease-out forwards}
  @keyframes burst{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.25);opacity:0}}

  .faves{margin:44px 0 70px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 26px}
  .faves h2{margin:0 0 4px;font-size:20px}
  .faves p{margin:0 0 14px;color:var(--muted);font-size:14px}
  .fave-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .fave-chips span{background:#FFE4EF;color:#B0246A;border-radius:999px;padding:7px 15px;font-size:13.5px;font-weight:650}
  .fave-chips .none{background:var(--chip);color:var(--muted);font-weight:500}
  .copybtn{background:var(--ink);color:#fff;border:none;border-radius:999px;padding:12px 24px;font-weight:650;font-size:14px}
  .copybtn:hover{background:#000}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;border-radius:999px;padding:11px 22px;font-size:14px;font-weight:600;opacity:0;transition:all .22s ease;z-index:100;pointer-events:none;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* =============== PITCH SECTION =============== */
  .pitch{margin:56px 0 70px;border-top:1px solid var(--line);padding-top:44px}
  .pitch h2.big{font-size:clamp(26px,4.5vw,40px);margin:0 0 12px;font-weight:750;text-wrap:balance}
  .pitch h2.big .hl{color:var(--pink)}
  .pitch .plede{max-width:62ch;color:var(--muted);font-size:15.5px;margin:0 0 24px}
  .pitch .plede strong{color:var(--ink)}
  .own{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:26px}
  .own > div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .own b{display:block;font-size:14.5px;margin-bottom:6px}
  .own p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .receipts{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 24px;margin-bottom:26px}
  .receipts .rlabel{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
  .tile .num{font-size:clamp(28px,4vw,40px);font-weight:750;font-variant-numeric:tabular-nums;line-height:1;color:var(--ink)}
  .tile .lab{font-size:12.5px;color:var(--muted);margin-top:6px}
  .receipts .fine{font-size:12px;color:var(--muted);margin:16px 0 0;border-top:1px dashed var(--line);padding-top:12px}
  .deal{border:2px solid var(--ink);border-radius:16px;padding:22px 26px;background:var(--panel)}
  .deal h3{margin:0 0 10px;font-size:18px}
  .deal ul{margin:0 0 18px;padding-left:20px;font-size:14.5px}
  .deal li{margin-bottom:6px}

  /* =============== BRAND HIT LIST =============== */
  .btier{margin-bottom:28px}
  .btier .rlabel{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
  .btnote{font-size:13.5px;color:var(--muted);margin:0 0 12px;max-width:60ch}
  .bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}
  .bcard{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;transition:transform .15s ease,border-color .15s ease,background .15s ease;font:inherit;color:inherit}
  .bcard:hover{transform:translateY(-2px);border-color:var(--ink)}
  .bcard.on{border-color:var(--pink);background:#FFF3F8;box-shadow:0 8px 20px -14px rgba(255,92,138,.65)}
  .bcard .bheart{position:absolute;top:12px;right:14px;font-size:15px}
  .bcard .bname{display:block;font-size:15px;margin-bottom:3px;padding-right:26px}
  .bcard .btag{display:inline-block;background:var(--chip);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;margin-bottom:9px}
  .bcard.on .btag{background:#FFE4EF;color:#B0246A}
  .bcard .bwhy{margin:0;font-size:13px;color:var(--muted);line-height:1.55}

  /* =============== THE MONEY MACHINE =============== */
  .machine{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-top:6px}
  .m-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .m-top h3{margin:0;font-size:18px}
  .m-cash{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:750;font-size:clamp(20px,3vw,28px);color:var(--ink)}
  .m-cash small{display:block;font-size:11px;font-weight:500;color:var(--muted);text-align:right;letter-spacing:.08em;text-transform:uppercase}
  .m-track{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 14px;-webkit-overflow-scrolling:touch}
  .m-stage{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:86px;position:relative}
  .m-stage .dot2{width:34px;height:34px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:15px;border:2px solid var(--line);transition:all .25s ease}
  .m-stage.done .dot2{background:#FFE4EF;border-color:var(--pink)}
  .m-stage.now .dot2{background:var(--pink);border-color:var(--pink);transform:scale(1.18);box-shadow:0 6px 16px -8px rgba(255,92,138,.8)}
  .m-stage .slab{font-size:11px;font-weight:650;color:var(--muted);white-space:nowrap}
  .m-stage.now .slab{color:var(--ink)}
  .m-stage:not(:last-child)::after{content:"";position:absolute;top:17px;left:calc(50% + 22px);width:calc(100% - 40px);height:2px;background:var(--line)}
  .m-stage.done:not(:last-child)::after{background:var(--pink)}
  .m-card{border:2px solid var(--ink);border-radius:14px;padding:16px 18px;background:var(--bg);margin-bottom:14px}
  .m-card .m-brand{font-weight:750;font-size:15.5px;margin-bottom:4px}
  .m-card .m-what{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55;min-height:3.1em}
  .m-card .m-auto{display:inline-block;margin-top:9px;background:#FFF3D6;color:#8a5a00;border-radius:999px;padding:4px 12px;font-size:11.5px;font-weight:650}
  .m-go{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .m-fine{font-size:11.5px;color:var(--muted);margin:12px 0 0}

  /* =============== D1 CAPTION CARD =============== */
  .d1-stage{background:#3E3E3C url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8"><rect width="8" height="8" fill="%233e3e3c"/><circle cx="1" cy="1" r=".7" fill="%23494947"/></svg>')}
  .d1-capbox{background:#fff;color:#111;padding:16px 26px;font-family:'Courier Prime',"Courier New",monospace;font-weight:700;font-size:clamp(22px,4vw,38px);line-height:1.3;box-shadow:0 4px 0 rgba(0,0,0,.35);max-width:82%;text-align:center}
  .d1-capbox .cursor{display:inline-block;width:.5em;height:1em;background:#FF5C8A;vertical-align:-.12em;margin-left:5px;animation:blink 1.05s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media(prefers-reduced-motion:reduce){.d1-capbox .cursor{animation:none}}
  .d1-input{margin-top:14px;background:rgba(255,255,255,.14);border:1px dashed rgba(255,255,255,.5);color:#fff;font-family:'Courier Prime',monospace;font-size:14px;padding:9px 14px;width:min(360px,80%);text-align:center;border-radius:6px}
  .d1-input::placeholder{color:rgba(255,255,255,.65)}
  .d1-shufflebtn{background:#FF5C8A;color:#fff}
  .d1-nav{display:flex;align-items:center;gap:18px;background:#fff;border-bottom:2px solid #111;padding:13px 18px;font-family:'Courier Prime',monospace;font-size:13.5px;font-weight:700}
  .d1-nav .brand{font-size:16px}
  .d1-nav .brand em{color:#FF5C8A;font-style:normal}
  .d1-nav a{color:#444;font-weight:400;text-decoration:none;cursor:pointer}
  .d1-nav a:hover{color:#111;text-decoration:underline;text-underline-offset:3px}
  .d1-nav .cta{margin-left:auto;background:#111;color:#fff;padding:7px 13px;border:none;font-family:inherit;font-weight:700;font-size:12.5px}
  .d1-nav .cta:hover{background:#FF5C8A}
  .d1-hero{display:flex;flex-direction:column;justify-content:center;gap:13px;padding:30px 24px;background:linear-gradient(160deg,#4a4a48,#6b6862 55%,#8b8378)}
  .d1-hero .cap{background:#fff;color:#111;font-family:'Courier Prime',monospace;font-weight:700;font-size:clamp(16px,2.3vw,22px);line-height:1.4;padding:10px 16px;width:max-content;max-width:100%;box-shadow:0 2px 0 rgba(0,0,0,.3);white-space:pre-line}
  .d1-hero .cap.pink{background:#FF5C8A;color:#fff;font-size:13px}
  .d1-btn{background:#FF5C8A;color:#fff;border:2px solid #111;font-family:'Courier Prime',monospace;font-weight:700;font-size:13.5px;padding:10px 18px;box-shadow:3px 3px 0 #111;width:max-content;transition:all .12s}
  .d1-btn:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 #111}
  .d1-cards{display:flex;gap:12px;padding:16px 18px;background:#EDEBE6;flex-wrap:wrap}
  .d1-card{background:#fff;border:2px solid #111;padding:13px 15px;font-family:'Courier Prime',monospace;font-size:13px;font-weight:700;flex:1;min-width:180px;transition:all .15s;cursor:pointer}
  .d1-card:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 #111}
  .d1-card small{display:block;font-weight:400;color:#777;margin-top:8px;font-size:11px}

  /* =============== D2 THE ISSUE =============== */
  .d2-stage{background:#FCFBF6;border:1px solid var(--line)}
  .d2-cover{text-align:center;padding:20px}
  .d2-cover .jp{font-family:'Shippori Mincho',serif;font-size:19px;letter-spacing:.55em;margin-left:.55em;display:block;color:#E0442C}
  .d2-cover .en{font-family:'Playfair Display',Georgia,serif;font-size:clamp(56px,9vw,86px);letter-spacing:.1em;margin-left:.1em;line-height:1;display:block;margin-top:6px;color:#1C1B18}
  .d2-cover .rule{width:170px;height:1px;background:#1C1B18;margin:16px auto}
  .d2-cover .cline{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:clamp(16px,2.6vw,21px);color:#3c3a34;display:block;min-height:1.5em;animation:fadeUp .5s ease both}
  .d2-cover .issue{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:#8a877e;display:block;margin-top:14px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .d2-flipbtn{background:#1C1B18;color:#FCFBF6}
  .d2-nav{display:flex;align-items:center;gap:22px;padding:14px 22px;border-bottom:1px solid #1C1B18;font-size:11px;letter-spacing:.2em;text-transform:uppercase;background:#FCFBF6;color:#1C1B18}
  .d2-nav .brand{font-family:'Playfair Display',serif;font-size:20px;letter-spacing:.13em;text-transform:none}
  .d2-nav a{color:#1C1B18;text-decoration:none;cursor:pointer}
  .d2-nav a:hover{color:#E0442C}
  .d2-nav .cta{margin-left:auto;border:1px solid #1C1B18;background:none;padding:7px 14px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:all .15s}
  .d2-nav .cta:hover{background:#1C1B18;color:#FCFBF6}
  .d2-hero{display:flex;flex-direction:column;justify-content:center;padding:32px 26px;gap:10px;background:linear-gradient(180deg,#FCFBF6 60%,#F6EEE4);color:#1C1B18}
  .d2-hero .kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#E0442C}
  .d2-hero h3{font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(26px,3.8vw,42px);line-height:1.08;margin:0;text-wrap:balance}
  .d2-hero h3 em{font-style:italic}
  .d2-hero p{margin:4px 0 0;font-size:14px;color:#5c5a54;max-width:52ch}
  .d2-row{display:flex;border-top:1px solid #1C1B18;background:#FCFBF6;color:#1C1B18}
  .d2-cell{flex:1;padding:15px 18px;border-right:1px solid #d9d5c9;min-width:0;transition:background .15s;cursor:pointer}
  .d2-cell:hover{background:#F6EEE4}
  .d2-cell:last-child{border-right:0}
  .d2-cell .no{font-family:'Playfair Display',serif;font-style:italic;color:#E0442C;font-size:15px}
  .d2-cell h4{font-family:'Playfair Display',serif;font-weight:400;font-size:16px;margin:4px 0 2px;line-height:1.25}
  .d2-cell small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8a877e}
  @media(max-width:640px){.d2-row{flex-direction:column}.d2-cell{border-right:0;border-bottom:1px solid #d9d5c9}.d2-cell:last-child{border-bottom:0}}

  /* =============== D3 HANKO =============== */
  .d3-stage{background:#F6F1E7;border:1px solid var(--line);cursor:crosshair}
  .d3-stage .stage-hint{color:#6f6a5e}
  .d3-center{text-align:center;pointer-events:none;z-index:2}

<canvas id="petals"></canvas>

<script>
// sakura petals: light, respects reduced motion
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('petals'), x = c.getContext('2d');
  let W, H;
  const P = [];
  function size(){ W = c.width = innerWidth; H = c.height = innerHeight; }
  size(); addEventListener('resize', size);
  for (let i = 0; i < 16; i++) P.push({
    x: Math.random()*innerWidth, y: Math.random()*innerHeight,
    r: 4+Math.random()*5, vy: .35+Math.random()*.5, vx: .15+Math.random()*.3,
    a: Math.random()*Math.PI*2, va: .008+Math.random()*.015, o: .18+Math.random()*.2
  });
  (function tick(){
    x.clearRect(0,0,W,H);
    for (const p of P){
      p.y += p.vy; p.x += Math.sin(p.a)*p.vx; p.a += p.va;
      if (p.y > H+12){ p.y = -12; p.x = Math.random()*W; }
      x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.globalAlpha = p.o;
      x.fillStyle = '#FFB7CE';
      x.beginPath(); x.ellipse(0,0,p.r,p.r*.62,0,0,Math.PI*2); x.fill();
      x.restore();
    }
    requestAnimationFrame(tick);
  })();
})();
</script>

function useTypewriter(text, speed=45){
  const [out, setOut] = useState('');
  useEffect(() => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches){ setOut(text); return; }
    setOut('');
    let i = 0;
    const t = setInterval(() => {
      i++; setOut(text.slice(0, i));
      if (i >= text.length) clearInterval(t);
    }, speed);
    return () => clearInterval(t);
  }, [text]);
  return out;
}

/* ---------------- love button w/ burst ---------------- */
function LoveButton({ loved, onToggle }){
  const [bursts, setBursts] = useState([]);
  const click = () => {
    onToggle();
    if (!loved){
      const items = Array.from({length:10}, (_,i) => ({
        id: Date.now()+i,
        dx: `${(Math.random()*160-80).toFixed(0)}px`,
        dy: `${(-40-Math.random()*110).toFixed(0)}px`,
        e: ['💖','✨','💘','🌸'][i%4],
      }));
      setBursts(items);
      setTimeout(() => setBursts([]), 900);
    }
  };
  return (
    <button className={`lovebtn ${loved ? 'loved' : ''}`} onClick={click} aria-pressed={loved}>
      <span className="hh">{loved ? '💖' : '🤍'}</span>{loved ? 'saved to your picks' : 'love this one? save it'}
      {bursts.map(b => <span key={b.id} className="burst" style={{'--dx':b.dx,'--dy':b.dy}}>{b.e}</span>)}
    </button>
  );
}

  { name: 'Pitched',      emoji: '💌', what: 'I send the pitch from the business inbox. You keep filming.', auto: '⏰ if they go quiet for 4 days, the system automatically reminds me to nudge them. No pitch ever gets forgotten.' },

  { name: 'Paid 🎉',      emoji: '💸', what: 'Invoice sent, money lands, and the machine rolls to the next brand. Same steps, every time, nothing slips.' },
];
const M_DEALS = [
  { brand: 'Bokksu',   pay: 4800 },
  { brand: 'FIGS',     pay: 9500 },
  { brand: 'Klook',    pay: 5200 },
  { brand: 'HOKA',     pay: 8500 },

function Machine({ toast }){
  const [si, setSi] = useState(0);
  const [di, setDi] = useState(0);
  const [cash, setCash] = useState(0);
  const [bursts, setBursts] = useState([]);
  const deal = M_DEALS[di % M_DEALS.length];
  const stage = M_STAGES[si];

  const advance = () => {
    if (si < M_STAGES.length - 1) { setSi(si + 1); return; }
    setCash(c => c + deal.pay);
    setBursts(['💸','🎉','💖','✨','💰','🎊'].map((e,i) => ({ e, id: Date.now()+i, dx: (Math.random()*160-80)+'px', dy: (-40-Math.random()*80)+'px' })));
    setTimeout(() => setBursts([]), 900);
    toast(`${deal.brand} paid!! next brand loaded 💌`);
    setDi(d => d + 1);
    setSi(0);
  };

  return (
    <div className="machine">
      <div className="m-top">
        <h3>watch a deal travel 👀</h3>
        <div className="m-cash">${cash.toLocaleString()}<small>earned in this little demo</small></div>
      </div>

      <div className="m-track">
        {M_STAGES.map((s, i) => (
          <div key={s.name} className={`m-stage ${i < si ? 'done' : ''} ${i === si ? 'now' : ''}`}>
            <div className="dot2">{s.emoji}</div>
            <div className="slab">{s.name}</div>
          </div>
        ))}
      </div>

      <div className="m-card">
        <div className="m-brand">{deal.brand} × Nina · {stage.name}</div>
        <p className="m-what">{stage.what}</p>
        {stage.auto && <span className="m-auto">{stage.auto}</span>}
      </div>

      <div className="m-go" style={{position:'relative'}}>
        <button className="copybtn" onClick={advance}>
          {si < M_STAGES.length - 1 ? 'move the deal forward 👉' : `collect $${deal.pay.toLocaleString()} 💸`}
        </button>
        {bursts.map(b => <span key={b.id} className="burst" style={{'--dx': b.dx, '--dy': b.dy}}>{b.e}</span>)}
      </div>

      <p className="m-fine">Example rates, but not crazy ones. Creators your size close numbers like these when somebody negotiates properly, and negotiating is my whole job. One lap through five brands is a year of ER shifts. The real version of this board is already built and running: all 11 brands loaded with their pitch angles, follow-up timers armed, every brand email tracked in one place.</p>
    </div>
  );
}

/* ---------------- app ---------------- */
function App(){
  const [idx, setIdx] = useState(0);
  const [dirn, setDirn] = useState('fwd');
  const [toast, setToast] = useState('');
  const [loves, setLoves] = useState(() => {
    try { return JSON.parse(localStorage.getItem('nina-picks') || '[]'); } catch(e){ return []; }
  });
  const toastTimer = useRef(null);
  const touchX = useRef(null);

  const showToast = useCallback(msg => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(''), 1800);
  }, []);

  const go = useCallback(n => {
    if (n < 0 || n > DIRS.length-1) return;
    setDirn(n > idx ? 'fwd' : 'back');
    setIdx(n);
  }, [idx]);

  useEffect(() => {
    const k = e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight') go(idx+1);
      if (e.key === 'ArrowLeft') go(idx-1);
    };
    addEventListener('keydown', k);
    return () => removeEventListener('keydown', k);
  }, [idx, go]);

  useEffect(() => { localStorage.setItem('nina-picks', JSON.stringify(loves)); }, [loves]);

  const d = DIRS[idx];
  const Stage = STAGES[d.id], Mock = MOCKS[d.id];
  const loved = loves.includes(d.id);
  const toggleLove = () => setLoves(l => loved ? l.filter(x => x !== d.id) : [...l, d.id]);
  const picks = DIRS.filter(x => loves.includes(x.id));

  const copyPicks = () => {
    const msg = picks.length
      ? `hi will!! my picks for the site: ${picks.map(p => `${p.num} ${p.name}`).join(' + ')} 💖`
      : 'hi will!! still deciding 🤔';
    navigator.clipboard && navigator.clipboard.writeText(msg);
    showToast('copied!! send it to Will 💌');
  };

  const copyDeal = () => {
    navigator.clipboard && navigator.clipboard.writeText("ok COO, let's do the 90 days 💅");
    showToast('copied!! DM it to Will 💌');
  };

  const [brandYes, setBrandYes] = useState(() => {
    try { return JSON.parse(localStorage.getItem('nina-brands') || '[]'); } catch(e){ return []; }
  });
  useEffect(() => { localStorage.setItem('nina-brands', JSON.stringify(brandYes)); }, [brandYes]);
  const toggleBrand = name => setBrandYes(b => b.includes(name) ? b.filter(x => x !== name) : [...b, name]);
  const copyBrands = () => {
    const msg = brandYes.length
      ? `ok COO, pitch me to: ${brandYes.join(', ')} 📣`
      : 'hi will!! still thinking about the brand list 🤔';
    navigator.clipboard && navigator.clipboard.writeText(msg);
    showToast('copied!! send it to Will 💌');

          <h1 className="title">Five ways <span className="hl">your site</span> could look</h1>

            your にな💖. <strong>Everything is playable:</strong> tap the logos, try the buttons, copy the colors.
            Heart your favorites and send them my way.
          </p>
        </div>
      </header>

      <div className="storybar">
        <div className="wrap">
          <div className="segs" aria-hidden="true">
            {DIRS.map((x, i) => (
              <span key={x.id} className={`seg ${i < idx ? 'done' : ''} ${i === idx ? 'active' : ''}`}><i></i></span>
            ))}
          </div>
          <div className="tabnames" role="tablist" aria-label="Design directions">
            {DIRS.map((x, i) => (
              <button key={x.id} className={i === idx ? 'on' : ''} role="tab" aria-selected={i === idx} onClick={() => go(i)}>
                <span className="n">{x.num}</span>{x.name}
              </button>
            ))}
          </div>
        </div>
      </div>

      <main className="wrap"
        onTouchStart={e => { touchX.current = e.touches[0].clientX; }}
        onTouchEnd={e => {
          if (touchX.current == null) return;
          const dx = e.changedTouches[0].clientX - touchX.current;
          if (dx < -55) go(idx+1);
          if (dx > 55) go(idx-1);
          touchX.current = null;
        }}>
        <div className={`dview ${dirn === 'back' ? 'back' : ''}`} key={d.id}>
          <div className="dhead"><span className="dnum">{d.num} / 05</span><h2 className="dname">{d.name}</h2></div>
          <p className="dwhy">{d.why}</p>

        <section className="pitch">
